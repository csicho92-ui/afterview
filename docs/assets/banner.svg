<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="AFTERVIEW — 면접이 끝난 뒤, 기억을 기록으로. 기록을 다음 기회로.">
  <rect width="1280" height="400" fill="#F8F7F4"/>
  <!-- 질문 카드 일러스트 -->
  <g transform="translate(820 72)">
    <rect x="40" y="40" width="360" height="236" rx="22" fill="#FFFFFF" stroke="#E4E1DA" stroke-width="2"/>
    <rect x="20" y="20" width="360" height="236" rx="22" fill="#FFFFFF" stroke="#E4E1DA" stroke-width="2"/>
    <rect x="0" y="0" width="360" height="236" rx="22" fill="#FFFFFF" stroke="#E4E1DA" stroke-width="2"/>
    <text x="28" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#35485D" letter-spacing="1.5">Q03</text>
    <rect x="80" y="33" width="210" height="14" rx="7" fill="#25282D" opacity="0.85"/>
    <rect x="28" y="78" width="120" height="10" rx="5" fill="#5F646B" opacity="0.5"/>
    <rect x="28" y="98" width="304" height="10" rx="5" fill="#E4E1DA"/>
    <rect x="28" y="116" width="272" height="10" rx="5" fill="#E4E1DA"/>
    <rect x="28" y="134" width="226" height="10" rx="5" fill="#E4E1DA"/>
    <rect x="28" y="170" width="132" height="28" rx="14" fill="#E9EEE9"/>
    <text x="44" y="189" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#4D5E51">+ 고개를 끄덕였다</text>
    <rect x="170" y="170" width="96" height="28" rx="14" fill="#E9EEE9"/>
    <text x="186" y="189" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#4D5E51">+ 긴장했다</text>
  </g>
  <!-- 로고 -->
  <g transform="translate(96 92)">
    <rect width="56" height="56" rx="14" fill="#35485D"/>
    <path d="M15.75 38.5 28 15.75l12.25 22.75" fill="none" stroke="#F8F7F4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="33.25" r="3.2" fill="#849889"/>
    <text x="76" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#35485D" letter-spacing="7">AFTERVIEW</text>
  </g>
  <text x="96" y="232" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="46" font-weight="800" fill="#25282D">면접이 끝나고,</text>
  <text x="96" y="290" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="46" font-weight="800" fill="#25282D">무엇이 남았나요?</text>
  <text x="98" y="336" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#849889" letter-spacing="3.5">EVERY INTERVIEW LEAVES SOMETHING BEHIND</text>
</svg>
